<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diCAPTCHA 認証ページ</title>
    <!-- EmailJS SDKの読み込み -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init({
            publicKey: "●●●●●●●●●●●●●●●●●",
        });
    </script>
    <!-- Google reCAPTCHA APIの読み込み -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #2c2f33;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #36393f;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #7289da; margin-top: 0; }
        p { color: #b9bbbe; font-size: 14px; line-height: 1.5; }
        .status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .loading { background-color: #faa61a; color: #fff; }
        .success { background-color: #43b581; color: #fff; }
        .error { background-color: #f04747; color: #fff; }
        .recaptcha-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #202225;
            background-color: #40444b;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #5b6eae; }
    </style>
</head>
<body>

    <div class="card">
        <h2>diCAPTCHA 認証</h2>
        <p id="info-text">人間であることを確認してください。</p>
        
        <div id="status-box" class="status loading" style="display: none;">処理中...</div>

        <!-- 1. reCAPTCHA & メール送信トリガー画面 -->
        <div id="captcha-section">
            <div class="recaptcha-container">
                <div class="g-recaptcha" data-sitekey="●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●●"></div>
            </div>
            <button onclick="sendMailWithCaptcha()">メールを送信する</button>
        </div>

        <!-- 2. パスコード入力画面 (メール送信後に表示) -->
        <div id="auth-section" style="display: none;">
            <p>メールに記載された6桁のパスコードを入力してください。</p>
            <input type="text" id="input-passcode" placeholder="6桁のコード" maxlength="6">
            <button onclick="verifyCode()">認証を完了する</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const discordId = urlParams.get('id');
        const email = urlParams.get('email');
        const correctPasscode = urlParams.get('passcode');

        const statusBox = document.getElementById('status-box');
        const infoText = document.getElementById('info-text');
        const captchaSection = document.getElementById('captcha-section');
        const authSection = document.getElementById('auth-section');

        // パラメータのバリデーション
        if (!discordId || !email || !correctPasscode) {
            statusBox.style.display = "block";
            statusBox.className = "status error";
            statusBox.textContent = "無効なURLです。Discordからやり直してください。";
            infoText.textContent = "パラメータが不足しています。";
            captchaSection.style.display = "none";
        }

        // reCAPTCHAをクリアした後にメール送信を実行
        function sendMailWithCaptcha() {
            const recaptchaResponse = grecaptcha.getResponse();

            if (!recaptchaResponse) {
                alert("「私はロボットではありません」にチェックを入れてください。");
                return;
            }

            // UIをロード中に切り替え
            captchaSection.style.display = "none";
            statusBox.style.display = "block";
            statusBox.className = "status loading";
            statusBox.textContent = "メールを送信しています...";
            infoText.textContent = `${email} 宛に認証コードを送信中...`;

            // EmailJSでメール送信
            emailjs.send("service_1bivy65", "template_2yicckm", {
                passcode: correctPasscode,
                email: email,
            })
            .then(() => {
                statusBox.style.display = "none";
                infoText.textContent = "メールを送信しました！";
                authSection.style.display = "block"; // パスコード入力画面を表示
            })
            .catch((err) => {
                console.error("EmailJS Error:", err);
                statusBox.className = "status error";
                statusBox.textContent = "メールの送信に失敗しました。";
                infoText.textContent = "時間をおいて再度お試しください。";
                captchaSection.style.display = "block";
                grecaptcha.reset();
            });
        }

        // ユーザーが入力したパスコードを検証し、RenderのBotへ通知してロールを付与
        async function verifyCode() {
            const userInput = document.getElementById('input-passcode').value.trim();

            if (userInput === correctPasscode) {
                statusBox.style.display = "block";
                statusBox.className = "status loading";
                statusBox.textContent = "ロールを付与しています...";
                infoText.textContent = "しばらくお待ちください...";
                authSection.style.display = "none";

                try {
                    const response = await fetch('https://dicaptcha.onrender.com/api/verify-success', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: discordId })
                    });

                    const result = await response.json();

                    if (result.success) {
                        statusBox.className = "status success";
                        statusBox.textContent = "認証成功！ロールが付与されました。";
                        infoText.textContent = "認証が完了しました。このタブを閉じてDiscordにお戻りください。";
                    } else {
                        throw new Error(result.error || "不明なエラー");
                    }
                } catch (err) {
                    console.error("API Error:", err);
                    statusBox.className = "status error";
                    statusBox.textContent = "ロールの付与に失敗しました。管理者に連絡してください。";
                    infoText.textContent = "エラーが発生しました。";
                }
            } else {
                alert("パスコードが違います。もう一度確認してください。");
            }
        }
    </script>
</body>
</html>
